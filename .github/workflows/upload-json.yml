name: "Bridge Layer - Auto Upload JSON"

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate signals.json
        run: |
          echo '{
            "status": "active",
            "timestamp": "'$(date -Iseconds)'",
            "message": "Data dari GitHub Actions"
          }' > signals.json
      
      - name: Generate web.json
        run: |
          echo '{
            "app": "Bridge Layer",
            "version": "1.0",
            "last_update": "'$(date -Iseconds)'"
          }' > web.json
      
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add signals.json web.json
          git diff --staged --quiet || git commit -m "Auto-update JSON [skip ci]"
          git push https://x-access-token:${{ secrets.PUSH_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
